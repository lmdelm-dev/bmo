version: 2.1

# Free open-source CI for the BMO repo (replaces GitHub Actions).
#
# ENABLE:
#   1. Sign up at https://app.circleci.com (free, no card needed)
#   2. On the dashboard choose "Projects" -> "Set Up Project" for
#      lmdelm-dev/bmo; install the CircleCI GitHub app when prompted.
#   3. Optional but recommended: apply to the free open-source program
#      (https://circleci.com/open-source/) for extra monthly credits.
#
# Job gating (keeps free credits low):
#   - static-checks     -> every push + PR (cheap)
#   - installer-linux   -> pushes to `main` only
#   - installer-macos   -> tags only (macOS credits are the priciest)
#   - release-tag       -> tags only (verifies the release tarball)
#
# The installer jobs stub out `ollama` and `opencode` on PATH so install.sh
# skips their multi-GB downloads (not needed to validate installer logic) -
# this keeps each build fast and inside the free credit budget.

jobs:
  static-checks:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install check tools (node, ruby)
          command: |
            sudo apt-get update >/dev/null
            sudo apt-get install -y --no-install-recommends nodejs npm ruby >/dev/null
      - run:
          name: Python app compiles
          command: |
            python -m py_compile gameboy.py bmo.py bmo_app.py bmo_ai.py \
              bmo_voice.py bmo_update.py bmo_shell.py bmo_config.py bmo_secure.py
      - run:
          name: Shell scripts lint
          command: |
            bash -n install.sh
            bash -n bmo
            bash -n scripts/release.sh
      - run:
          name: npm package
          command: |
            node --check cli.js
            npm pack --dry-run
      - run:
          name: Homebrew formula syntax
          command: ruby -c Formula/bmo.rb

  installer-linux:
    docker:
      - image: cimg/python:3.12
    environment:
      BMO_ASSUME_YES: "1"
      BMO_HOME: /tmp/bmo-ci
      BMO_BIN: /tmp/bmo-ci-bin
      XDG_DESKTOP_DIR: /tmp/bmo-ci-desktop
    steps:
      - checkout
      - run:
          name: Stub heavy optional downloads (ollama, opencode)
          command: |
            mkdir -p /tmp/fakebin
            for t in ollama opencode; do
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/fakebin/$t
              chmod +x /tmp/fakebin/$t
            done
      - run:
          name: Run the curl installer
          command: |
            export PATH="/tmp/fakebin:$PATH"
            mkdir -p "$XDG_DESKTOP_DIR"
            bash install.sh -y

  installer-macos:
    macos:
      xcode: "15.0.0"
    environment:
      BMO_ASSUME_YES: "1"
      BMO_HOME: /tmp/bmo-ci
      BMO_BIN: /tmp/bmo-ci-bin
      XDG_DESKTOP_DIR: /tmp/bmo-ci-desktop
    steps:
      - checkout
      - run:
          name: Stub heavy optional downloads (ollama, opencode)
          command: |
            mkdir -p /tmp/fakebin
            for t in ollama opencode; do
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/fakebin/$t
              chmod +x /tmp/fakebin/$t
            done
      - run:
          name: Run the curl installer
          command: |
            export PATH="/tmp/fakebin:$PATH"
            mkdir -p "$XDG_DESKTOP_DIR"
            bash install.sh -y

  release-tag:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install check tools (node)
          command: |
            sudo apt-get update >/dev/null
            sudo apt-get install -y --no-install-recommends nodejs npm >/dev/null
      - run:
          name: Verify tag tarball packages + checksums
          command: |
            TAG="${CIRCLE_TAG}"
            curl -fsSL "https://codeload.github.com/lmdelm-dev/bmo/tar.gz/refs/tags/${TAG}" -o /tmp/bmo.tar.gz
            tar xzf /tmp/bmo.tar.gz
            python -m py_compile "bmo-${TAG}/gameboy.py" "bmo-${TAG}/bmo.py" \
              "bmo-${TAG}/bmo_app.py" "bmo-${TAG}/bmo_ai.py" \
              "bmo-${TAG}/bmo_voice.py" "bmo-${TAG}/bmo_update.py" \
              "bmo-${TAG}/bmo_shell.py" "bmo-${TAG}/bmo_config.py" "bmo-${TAG}/bmo_secure.py"
            cd "bmo-${TAG}"
            bash -n install.sh bmo scripts/release.sh
            node --check cli.js
            ./scripts/release.sh --check "${TAG}"
            echo "tag tarball OK"

workflows:
  version: 2
  ci:
    jobs:
      - static-checks
      - installer-linux:
          filters:
            branches:
              only: main
          requires:
            - static-checks
      - installer-macos:
          filters:
            tags:
              only: /v.*/
            branches:
              ignore: /.*/
          requires:
            - static-checks
      - release-tag:
          filters:
            tags:
              only: /v.*/
            branches:
              ignore: /.*/
          requires:
            - static-checks
