name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python app compiles
        run: python -m py_compile gameboy.py

      - name: Shell scripts lint
        run: |
          bash -n install.sh
          bash -n bmo
          bash -n scripts/release.sh

      - name: npm package
        run: |
          node --check cli.js
          npm pack --dry-run

      - name: Homebrew formula syntax
        run: ruby -c Formula/bmo.rb

  # Verify the full dependency-bootstrap installer runs cleanly on every
  # supported OS (the user-facing "curl | bash" / npm install path).
  bootstrap-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run curl installer (Linux / macOS)
        if: matrix.os != 'windows-latest'
        env:
          BMO_ASSUME_YES: "1"
          BMO_HOME: /tmp/bmo-ci
          BMO_BIN: /tmp/bmo-ci-bin
          XDG_DESKTOP_DIR: /tmp/bmo-ci-desktop
        run: |
          mkdir -p "$XDG_DESKTOP_DIR"
          bash install.sh -y

      - name: Run npm install path (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          BMO_ASSUME_YES: "1"
        run: |
          npm install
          node cli.js --install

  release-package:
    # on every tag, verify the source tarball packages cleanly. The real sha256
    # lives in the Homebrew tap repo; run ./scripts/release.sh after pushing a
    # tag to produce it.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag tarball packages
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          curl -fsSL "https://codeload.github.com/lmdelm-dev/bmo/tar.gz/refs/tags/${TAG}" -o /tmp/bmo.tar.gz
          tar xzf /tmp/bmo.tar.gz
          python -m py_compile "bmo-${TAG}/gameboy.py"
          cd "bmo-${TAG}"
          bash -n install.sh bmo scripts/release.sh
          node --check cli.js
          echo "tag tarball OK"
