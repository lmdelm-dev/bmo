name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python app compiles
        run: python -m py_compile gameboy.py

      - name: Shell scripts lint
        run: |
          bash -n install.sh
          bash -n bmo
          bash -n scripts/release.sh

      - name: npm package
        run: |
          node --check cli.js
          npm pack --dry-run

      - name: Homebrew formula syntax
        run: ruby -c Formula/bmo.rb

  checksums:
    # on every tag, verify the committed sha256 matches the GitHub tarball
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release checksums
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          chmod +x scripts/release.sh
          ./scripts/release.sh --check "$TAG"
