name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python app compiles
        run: python -m py_compile gameboy.py

      - name: Shell scripts lint
        run: |
          bash -n install.sh
          bash -n bmo
          bash -n scripts/release.sh

      - name: npm package
        run: |
          node --check cli.js
          npm pack --dry-run

      - name: Homebrew formula syntax
        run: ruby -c Formula/bmo.rb

  release-package:
    # on every tag, verify the source tarball packages cleanly (mirrors the
    # checksum the release notes will point at). The real sha256 lives in the
    # AUR/tap repos; run ./scripts/release.sh after pushing a tag to get it.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag tarball packages
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          curl -fsSL "https://codeload.github.com/lmdelm-dev/bmo/tar.gz/refs/tags/${TAG}" -o /tmp/bmo.tar.gz
          tar xzf /tmp/bmo.tar.gz
          python -m py_compile "bmo-${TAG}/gameboy.py"
          cd "bmo-${TAG}"
          bash -n install.sh bmo scripts/release.sh
          node --check cli.js
          echo "tag tarball OK"
